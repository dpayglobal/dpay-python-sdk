name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run pytest

  no-runtime-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.10'
      - name: Sync client must work with no dependencies installed
        run: |
          uv run --no-project --isolated --with . python - <<'PY'
          import importlib.util

          from dpay import DPayClient
          from dpay.testing import MockHttpClient

          transport = MockHttpClient()
          transport.queue_json(200, {"transaction": {"id": "tx-1", "status": "paid"}})
          client = DPayClient(service="s", secret_hash="h", http_client=transport)
          assert client.payments.details("tx-1").is_paid

          assert importlib.util.find_spec("httpx") is None, "httpx must not be pulled in by default"

          print("OK: zero runtime dependencies")
          PY

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  php-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --all-extras
      - name: Golden vectors from the PHP SDK
        run: uv run pytest tests/test_php_parity.py -q
